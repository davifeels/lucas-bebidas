<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="30%" stop-color="#E4B441"/>
      <stop offset="60%" stop-color="#C28F22"/>
      <stop offset="100%" stop-color="#8F620E"/>
    </linearGradient>

    <radialGradient id="hzBadgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2129"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>

    <linearGradient id="hzTextSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left: Stylized Modern Seal (x: 75, y: 70, radius: 52) -->
  <g transform="translate(70, 70)">
    <!-- Laurel Wreath Left -->
    <path d="M-38 22 C-45 10 -45 -12 -38 -25 C-38 -10 -35 10 -28 26 Z" fill="url(#hzGold)" opacity="0.85"/>
    <path d="M-44 -18 C-50 -15 -52 -8 -48 -3 C-45 -5 -40 -12 -44 -18 Z" fill="url(#hzGold)"/>
    <path d="M-47 3 C-54 7 -55 14 -50 18 C-46 15 -43 8 -47 3 Z" fill="url(#hzGold)"/>
    <path d="M-40 22 C-45 28 -43 35 -37 37 C-34 32 -35 25 -40 22 Z" fill="url(#hzGold)"/>

    <!-- Laurel Wreath Right (Mirrored) -->
    <path d="M38 22 C45 10 45 -12 38 -25 C38 -10 35 10 28 26 Z" fill="url(#hzGold)" opacity="0.85"/>
    <path d="M44 -18 C50 -15 52 -8 48 -3 C45 -5 40 -12 44 -18 Z" fill="url(#hzGold)"/>
    <path d="M47 3 C54 7 55 14 50 18 C46 15 43 8 47 3 Z" fill="url(#hzGold)"/>
    <path d="M40 22 C45 28 43 35 37 37 C34 32 35 25 40 22 Z" fill="url(#hzGold)"/>

    <!-- Outer Golden Ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#hzGold)" stroke-width="3.5" filter="url(#hzGlow)"/>
    <circle cx="0" cy="0" r="46" fill="url(#hzBadgeBg)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#hzGold)" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>

    <!-- Crown inside badge -->
    <g transform="translate(0, -14) scale(0.48)">
      <path d="M-45 20 L-60 -35 L-25 -5 L0 -65 L25 -5 L60 -35 L45 20 Q0 30 -45 20 Z" 
            fill="url(#hzGold)" stroke="#FFF" stroke-width="1"/>
      <circle cx="-60" cy="-35" r="7" fill="url(#hzGold)"/>
      <circle cx="-25" cy="-5" r="5" fill="url(#hzGold)"/>
      <circle cx="0" cy="-65" r="9" fill="url(#hzGold)"/>
      <circle cx="25" cy="-5" r="5" fill="url(#hzGold)"/>
      <circle cx="60" cy="-35" r="7" fill="url(#hzGold)"/>
    </g>

    <!-- Monogram 'L' inside badge -->
    <text x="0" y="24" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="28" 
          fill="url(#hzTextSilver)">L</text>
  </g>

  <!-- Right: Typography Hierarchy -->
  <g transform="translate(145, 0)">
    <!-- Brand Label / Sector Tag -->
    <text x="0" y="38" 
          font-family="'Montserrat', sans-serif" 
          font-weight="700" 
          font-size="11" 
          letter-spacing="5" 
          fill="#D4AF37">CONVENIÊNCIA &amp; DISTRIBUIÇÃO</text>

    <!-- LUCAS Primary Wordmark -->
    <text x="0" y="85" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="52" 
          letter-spacing="2" 
          fill="#FFFFFF">LUCAS</text>

    <!-- Bebidas Script Wordmark -->
    <text x="215" y="87" 
          font-family="'Playball', 'Brush Script MT', cursive" 
          font-style="italic" 
          font-weight="700" 
          font-size="44" 
          fill="url(#hzGold)">Bebidas</text>

    <!-- Subtitle / Location -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="-8" x2="430" y2="-8" stroke="#2B2F3B" stroke-width="1"/>
      <text x="0" y="7" 
            font-family="'Plus Jakarta Sans', sans-serif" 
            font-weight="600" 
            font-size="11.5" 
            letter-spacing="2" 
            fill="#94A3B8">PLANALTINA - DF • SETOR RESIDENCIAL LESTE (BURITIS I)</text>
    </g>
  </g>
</svg>