<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA8"/>
      <stop offset="35%" stop-color="#E5AF36"/>
      <stop offset="70%" stop-color="#BE891C"/>
      <stop offset="100%" stop-color="#8F620E"/>
    </linearGradient>

    <radialGradient id="cpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="75%" stop-color="#0F1015"/>
      <stop offset="100%" stop-color="#07070A"/>
    </radialGradient>

    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Disc Base -->
  <circle cx="200" cy="200" r="190" fill="url(#cpBg)" stroke="url(#cpGold)" stroke-width="6" filter="url(#cpGlow)"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#FFEFA8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#cpGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>

  <!-- Laurel Wreath in circular alignment -->
  <g id="cp-laurel-left" fill="url(#cpGold)">
    <path d="M72 170 C60 205 60 250 82 290 C78 245 84 205 100 175 Z" opacity="0.8"/>
    <path d="M52 175 C42 185 45 200 55 205 C60 198 62 185 52 175 Z"/>
    <path d="M48 212 C36 222 40 238 52 242 C56 234 57 220 48 212 Z"/>
    <path d="M53 250 C42 262 48 278 60 280 C64 271 63 258 53 250 Z"/>
    <path d="M68 288 C60 302 70 316 82 316 C85 306 82 295 68 288 Z"/>
    <path d="M92 322 C86 336 100 348 114 344 C114 334 108 325 92 322 Z"/>
    <path d="M125 348 C122 362 138 370 152 364 C150 354 142 347 125 348 Z"/>
  </g>
  <use href="#cp-laurel-left" transform="translate(400, 0) scale(-1, 1)" />

  <!-- Crown (Top Center) -->
  <g transform="translate(200, 115) scale(0.85)">
    <!-- Crown Base Band -->
    <path d="M-60 25 Q0 38 60 25 L55 35 Q0 48 -55 35 Z" fill="url(#cpGold)"/>
    <circle cx="-30" cy="33" r="2.5" fill="#FFFFFF"/>
    <circle cx="0" cy="37" r="3" fill="#FFFFFF"/>
    <circle cx="30" cy="33" r="2.5" fill="#FFFFFF"/>

    <!-- Crown Peaks -->
    <path d="M-60 25 L-75 -35 L-30 -5 L0 -65 L30 -5 L75 -35 L60 25 Q0 38 -60 25 Z" 
          fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="1.5"/>

    <!-- Crown Pearls -->
    <circle cx="-75" cy="-35" r="7" fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="1.5"/>
    <circle cx="-30" cy="-5" r="5" fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="1"/>
    <circle cx="0" cy="-65" r="9" fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="2"/>
    <circle cx="30" cy="-5" r="5" fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="1"/>
    <circle cx="75" cy="-35" r="7" fill="url(#cpGold)" stroke="#FFEFA8" stroke-width="1.5"/>
  </g>

  <!-- Center Monogram: "LB" or "LUCAS" -->
  <!-- Main LUCAS -->
  <text x="200" y="222" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="52" 
        letter-spacing="2" 
        fill="#FFFFFF"
        stroke="#0E1015"
        stroke-width="5"
        stroke-linejoin="round">LUCAS</text>

  <!-- Bebidas Script Underneath -->
  <text x="200" y="268" 
        text-anchor="middle" 
        font-family="'Playball', 'Brush Script MT', cursive" 
        font-style="italic" 
        font-weight="700" 
        font-size="40" 
        fill="url(#cpGold)">Bebidas</text>

  <!-- Bottom Accent / Location -->
  <text x="200" y="306" 
        text-anchor="middle" 
        font-family="'Montserrat', sans-serif" 
        font-weight="700" 
        font-size="9" 
        letter-spacing="4" 
        fill="#D4AF37">PLANALTINA - DF</text>
</svg>