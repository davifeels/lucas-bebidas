      <path d="M125 350 C105 310 100 250 115 190 C113 250 120 310 145 365 Z"/>
      <path d="M102 195 C88 200 80 215 85 225 C92 222 105 210 106 195 Z"/>
      <path d="M92 228 C76 235 70 250 78 260 C85 255 96 242 97 228 Z"/>
      <path d="M86 265 C68 273 65 290 73 300 C80 293 90 280 91 265 Z"/>
