      <path d="M94 345 C80 357 82 374 95 380 C99 370 103 356 98 345 Z"/>
      <path d="M112 380 C100 395 107 410 120 414 C123 402 123 389 116 380 Z"/>
      <path d="M138 410 C128 424 139 438 153 438 C153 425 149 414 141 410 Z"/>
      <path d="M172 433 C165 447 179 458 193 454 C190 442 182 433 174 433 Z"/>
