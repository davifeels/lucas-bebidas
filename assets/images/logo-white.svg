      <path d="M185 155 Q250 170 315 155 L310 165 Q250 180 190 165 Z"/>
      <circle cx="215" cy="160" r="2.5" fill="#0E1015"/>
      <circle cx="250" cy="165" r="3.5" fill="#0E1015"/>
      <circle cx="285" cy="160" r="2.5" fill="#0E1015"/>
      <path d="M185 155 L165 85 L215 130 L250 50 L285 130 L315 85 L315 155 Q250 170 185 155 Z"/>
      <circle cx="165" cy="85" r="8"/>
      <circle cx="205" cy="100" r="6"/>
      <circle cx="250" cy="50" r="10"/>
      <circle cx="295" cy="100" r="6"/>
      <circle cx="335" cy="85" r="8"/>
    </g>

    <!-- Typography LUCAS -->
    <text x="250" y="278" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="80" 
          letter-spacing="2" 
          stroke-width="0">LUCAS</text>

    <!-- Typography Bebidas -->
    <text x="250" y="342" 
